<!DOCTYPE html>
<html lang="kr" xmlns:th="http://www.thymeleaf.org">
   <head>
      <!-- basic -->
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <!-- mobile metas -->
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="viewport" content="initial-scale=1, maximum-scale=1">
      <!-- site metas -->
      <title>난다펜션</title>
      <meta name="keywords" content="">
      <meta name="description" content="">
      <meta name="author" content="">
      <!-- 카카오 css-->
      <link rel="stylesheet" href="css/kakaomap.css">
      <!-- bootstrap css -->
      <link rel="stylesheet" href="css/bootstrap.min.css">
      <!-- style css -->
      <link rel="stylesheet" href="css/style.css">
      <!-- Responsive-->
      <link rel="stylesheet" href="css/responsive.css">
      <!-- Scrollbar Custom CSS -->
      <link rel="stylesheet" href="css/jquery.mCustomScrollbar.min.css">
      <!-- Tweaks for older IEs-->
      <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/2.1.5/jquery.fancybox.min.css"
            media="screen">
      <link rel="stylesheet" href="css/custom.css">
      <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script><![endif]-->
      <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=1cbcc6060a0aaa920d7ff019f63b4816"></script>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
   </head>
   <!-- body -->
   <body class="main-layout">
      <!-- header -->
      <header>
         <!-- header inner -->
         <div class="header">
            <div class="container">
               <div class="row">
                  <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 col logo_section">
                     <div class="full">
                        <div class="center-desk">
                           <div class="logo">
                              <a th:href="@{/}"><img src="img/logo.png" alt="#" /></a>
                           </div>
                        </div>
                     </div>
                  </div>
                  <div class="col-xl-9 col-lg-9 col-md-9 col-sm-9">
                     <nav class="navigation navbar navbar-expand-md navbar-dark ">
                        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsExample04"
                                aria-controls="navbarsExample04" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarsExample04">
                           <ul class="navbar-nav mr-auto">
                              <li class="nav-item ">
                                 <a class="nav-link" th:href="@{/controlBooking}">객실 상황</a>
                              </li>
                              <li class="nav-item">
                                 <a class="nav-link" th:href="@{/controlRoom}">객실 정보</a>
                              </li>
                              <li class="nav-item active">
                                 <a class="nav-link" th:href="@{/controlPrice}">요금 설정</a>
                              </li>
                           </ul>
                        </div>
                     </nav>
                  </div>
               </div>
            </div>
         </div>
      </header>
      <!-- end header inner -->
      <!-- end header -->
      <div class="container">
         <table class="table table-striped-columns" style="text-align: center">
            <thead>
            <tr>
               <th>개장 기간</th>
               <th>머드 축제 기간</th>
               <th>특별 기간</th>
               <th></th>
            </tr>
            </thead>
            <tbody>
               <tr>
                  <td><input class ="inputPeriod" type="text" id="beachOpenDate" placeholder="개장일 선택"> - <input class ="inputPeriod" type="text" id="beachCloseDate" placeholder="폐장일 선택"> </td>
                  <td><input class ="inputPeriod" type="text" id="festivalOpenDate" placeholder="축제 시작일 선택"> - <input class ="inputPeriod" type="text" id="festivalCloseDate" placeholder="축제 종료일 선택"></td>
                  <td><input class ="inputPeriod" type="text" id="specialStart" placeholder="특별 시작일 선택"> - <input class ="inputPeriod" type="text" id="specialEnd" placeholder="특별 종료일 선택"></td>
                  <td>
                     <button type="button" class="btn btn-secondary" th:onclick="savePeriod()">저장</button>
                  </td>
               </tr>
            </tbody>
         </table>
        <table class="table table-striped-columns" style="text-align: center">
           <thead>
            <tr>
               <th>방 유형</th>
               <th>기본 가격</th>
               <th>개장 시기 가격</th>
               <th>머드 축제 가격</th>
               <th>특별 가격</th>
            </tr>
           </thead>
           <tbody>
              <tr>
                 <td>
                    <select id="roomTypeSelect" th:onclick="selectType()"> <option value=" ">선택</option>
                       <option value="coupleRoom">커플룸</option>
                       <option value="familyTwo">투룸</option>
                       <option value="familyOne">원룸</option>
                       <option value="duplexTwo">복층투룸</option>
                       <option value="duplexOne">복층원룸</option>
                    </select>
                 </td>
                 <td><input type="text" id='roomPrice'></input></td>
                 <td><input type="text" id="roomSPrice"></input></td>
                 <td><input type="text" id="roomUPrice"></input></td>
                 <td><input type="text" id="roomSfPrice"></input></td>
                 <td>
                    <button type="button" class="btn btn-secondary" th:onclick="savePrice()">저장</button>
              </td>
              </tr>
           </tbody>
        </table>
         <table class="table table-striped-columns" style="text-align: center">
            <thead>
               <tr>
                  <th>방 유형</th>
                  <th>방 이름</th>
                  <th>기본 가격</th>
                  <th>개장 시기 가격</th>
                  <th>머드 축제 가격</th>
                  <th>특별 가격</th>
               </tr>
            </thead>
            <tbody>
            <tr th:each="room : ${roomPrice}">
               <td th:text="${room.roomType}"></td>
               <td th:text="${room.roomNm}"></td>
               <td class="price-value" th:text="${room.roomPrice}"></td>
               <td class="price-value" th:text="${room.roomSPrice}"></td>
               <td class="price-value" th:text="${room.roomUPrice}"></td>
               <td class="price-value" th:text="${room.roomSfPrice}"></td>
            </tr>
            </tbody>
         </table>
      </div>
      <!--  footer -->
      <footer>
         <div class="footer">
            <div class="container">
               <div class="row">
                  <ul class="conta">
                     <li class="nav-item active">
                        <a class="nav-link" th:href="@{/controlBooking}">객실 상황</a>
                     </li>
                     <li class="nav-item">
                        <a class="nav-link" th:href="@{/controlRoom}">객실 정보</a>
                     </li>
                     <li class="nav-item">
                        <a class="nav-link" th:href="@{/controlPrice}">요금 설정</a>
                     </li>
                  </ul>
               </div>
            </div>
            <div class="copyright">
               <div class="container">
                  <div class="row">
                     <div class="col-md-10 offset-md-1">

                        <p>
                        © 2025 All Rights Reserved.</a>
                        <a>Distributed YDH</a>
                        </p>

                     </div>
                  </div>
               </div>
            </div>
         </div>
      </footer>
      <!-- end footer -->
      <!-- Javascript files-->
      <script src="js/jquery.min.js"></script>
      <script src="js/bootstrap.bundle.min.js"></script>
      <script src="js/jquery-3.0.0.min.js"></script>
      <!-- sidebar -->
      <script src="js/jquery.mCustomScrollbar.concat.min.js"></script>
      <script src="js/custom.js"></script>
      <!-- js -->
      <script src="js/bookingPrice.js"></script>
      <!--flatpicker-->
      <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
      <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>

   </body>
</html>
